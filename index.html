<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Kian's Algebra Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: one calm study column; a section list on the home view, one problem card at a time in a set. */
:root{
  --bg:#f4f7f6; --surface:#ffffff; --ink:#14201c; --muted:#56675f; --line:#d6e0dc; --grid:#e7eeeb;
  --accent:#17705c; --accent-ink:#ffffff; --accent-soft:#e0efe9; --mark:#f3d55b;
  --good:#1c7a3d; --good-soft:#e2f3e7; --bad:#b3362e; --bad-soft:#fbe6e3; --half:#a86b0a; --half-soft:#fbf0d9;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-math:"STIX Two Text", "Cambria Math", "Times New Roman", serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1412; --surface:#151d1a; --ink:#e5eeea; --muted:#94a59d; --line:#28342f; --grid:#1f2925;
  --accent:#55c4a5; --accent-ink:#062219; --accent-soft:#153129; --mark:#d9bb45;
  --good:#62cb88; --good-soft:#14301f; --bad:#f07c70; --bad-soft:#3a1d1a; --half:#e3b04f; --half-soft:#352a12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1412; --surface:#151d1a; --ink:#e5eeea; --muted:#94a59d; --line:#28342f; --grid:#1f2925;
  --accent:#55c4a5; --accent-ink:#062219; --accent-soft:#153129; --mark:#d9bb45;
  --good:#62cb88; --good-soft:#14301f; --bad:#f07c70; --bad-soft:#3a1d1a; --half:#e3b04f; --half-soft:#352a12; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(28px,6vw,40px);font-weight:700;letter-spacing:-.01em}
h2{font-size:22px;font-weight:700}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.lede{color:var(--muted);max-width:60ch;margin:8px 0 0}
.m{font-family:var(--f-math);font-size:1.08em;white-space:nowrap}
.m i{font-style:italic}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,.choice:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:700}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding-inline:10px}
.btn.ghost:hover{color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:default}

/* home */
.head{display:flex;flex-direction:column;gap:6px;margin-bottom:24px}
.test{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:18px 20px;margin-bottom:20px}
.test p{margin:2px 0 0;opacity:.9;font-size:15px}
.test .btn{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.row{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:14px;padding:14px 16px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;width:100%}
.row:first-child{border-top:0}
.row:hover{background:var(--accent-soft)}
.row .num{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--accent);font-variant-numeric:tabular-nums}
.row .t{font-weight:700;display:block}
.row .d{color:var(--muted);font-size:14px;display:block}
.row > span{min-width:0}
.chip{font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap;font-variant-numeric:tabular-nums;background:var(--grid);color:var(--muted)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.half{background:var(--half-soft);color:var(--half)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.how{margin-top:22px;color:var(--muted);font-size:14px;max-width:62ch}

/* quiz */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.prog{display:flex;gap:4px;margin:6px 0 18px}
.prog span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.prog span.cur{background:var(--muted)}
.prog span.first{background:var(--good)}
.prog span.retry{background:var(--half)}
.prog span.shown{background:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:16px}
.tag{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700}
.prompt{font-size:18px;margin:0}
.eq{font-size:21px;padding:10px 0;overflow-x:auto}
.graph{width:100%;max-width:340px;height:auto;display:block;align-self:center}
.g-grid{stroke:var(--grid);stroke-width:1}
.g-axis{stroke:var(--muted);stroke-width:1.4}
.g-lbl{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.g-curve{stroke:var(--accent);stroke-width:2.6;fill:none;stroke-linecap:round}
.g-dot{fill:var(--accent)}
.g-open{fill:var(--surface);stroke:var(--accent);stroke-width:2.2}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:14px;color:var(--muted);font-weight:700}
.field input{font-family:var(--f-math);font-size:20px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
.field input.ok{border-color:var(--good);background:var(--good-soft)}
.field input.no{border-color:var(--bad);background:var(--bad-soft)}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);padding:12px 14px;width:100%}
.choice:hover{border-color:var(--accent)}
.choice .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice.sel .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.choice.ok{border-color:var(--good);background:var(--good-soft)}
.choice.no{border-color:var(--bad);background:var(--bad-soft)}
.choice > span:last-child{min-width:0;overflow-x:auto}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.msg{font-weight:700;min-height:1.5em;margin:0}
.msg.good{color:var(--good)} .msg.bad{color:var(--bad)} .msg.info{color:var(--muted)}
.hint{background:var(--half-soft);border-radius:10px;padding:12px 14px;margin:0}
.hint b{color:var(--half)}
.steps{border-top:1px dashed var(--line);padding-top:14px}
.steps h3{font-size:15px;margin-bottom:8px}
.steps ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.steps li{overflow-x:auto}
.ans{margin:10px 0 0;font-weight:700}
.tip{color:var(--muted);font-size:13px;margin:0}

/* piecewise */
.pw{display:inline-flex;align-items:center;gap:10px;font-size:21px}
.pw-b{display:grid;grid-template-columns:auto auto;column-gap:22px;row-gap:4px;border-left:2px solid var(--ink);border-radius:10px 0 0 10px;padding:4px 0 4px 14px}
.pw-c{color:var(--muted);font-size:.8em;align-self:center;white-space:nowrap}

/* summary */
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.big{font-family:var(--f-display);font-size:56px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.recap{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.recap li{display:grid;grid-template-columns:28px 64px 1fr;gap:8px;align-items:center;font-size:15px}
.dot{width:12px;height:12px;border-radius:50%}
.dot.first{background:var(--good)} .dot.retry{background:var(--half)} .dot.shown{background:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:14px;color:var(--muted);font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* progress */
.progbtn{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 18px;margin-bottom:20px}
.progbtn:hover{border-color:var(--accent)}
.progbtn > span:first-child{min-width:0;display:flex;flex-direction:column}
.progbtn .d,.d{color:var(--muted);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:8px}
.stats > div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column}
.big2{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.sub{margin:26px 0 10px}
.table{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.table table{border-collapse:collapse;width:100%;min-width:560px}
.table th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
.table td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table .n{font-variant-numeric:tabular-nums}
.spark{width:96px;height:26px;display:block}
.btn.small{padding:5px 12px;font-size:14px}
.btn.danger{color:var(--bad)}
.hist{display:flex;flex-direction:column;gap:8px}
.att{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.att summary{display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:center;padding:12px 14px;cursor:pointer;list-style:none}
.att summary::-webkit-details-marker{display:none}
.att summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:12px}
.att[open] summary{border-bottom:1px dashed var(--line)}
.att .when{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.att .what{min-width:0}
.att .res{white-space:nowrap}
.attbody{padding:12px 14px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots .dot{width:14px;height:14px;border-radius:4px}
.dot.none{background:var(--line)}
.missed{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:12px}
.missed li > span{display:block;overflow-wrap:anywhere}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.fbtn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 14px;font-weight:700;font-size:14px}
.fbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@media (max-width:560px){.att summary{grid-template-columns:1fr auto}.att .when{grid-column:1/-1}}

/* units, concepts, typed answers */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.tab{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;min-width:0}
.tab span{color:var(--muted);font-size:13px}
.tab.on{border-color:var(--accent);background:var(--accent-soft)}
.tab.on strong{color:var(--accent)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.duo .test{margin:0;flex-direction:column;align-items:flex-start;justify-content:space-between}
.concard{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:1.5px solid var(--accent);background:var(--surface);border-radius:14px;padding:18px 20px}
.concard strong{font-family:var(--f-display);font-size:20px}
.concard .go{margin-top:auto;padding-top:8px;color:var(--accent);font-weight:700}
.concard:hover{background:var(--accent-soft)}
@media (max-width:620px){.duo{grid-template-columns:1fr}}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;z-index:2}
.concepts{display:flex;flex-direction:column;gap:16px}
.concept{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;scroll-margin-top:60px}
.concept.mini{margin-top:12px}
.concept header{display:flex;align-items:baseline;gap:12px}
.concept header .num{font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--accent)}
.bigidea{margin:0;font-size:17px;max-width:65ch}
.rules{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:8px 16px;margin:0;padding:12px 14px;background:var(--bg);border-radius:10px}
.rules dt{font-weight:700;color:var(--muted);font-size:14px}
.rules dd{margin:0;min-width:0;overflow-x:auto}
@media (max-width:520px){.rules{grid-template-columns:1fr}.rules dd{margin-bottom:6px}}
.ex{border-left:3px solid var(--accent);padding:4px 0 4px 14px}
.ex p{margin:6px 0}
.ex ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.ex li{overflow-x:auto}
.watch{background:var(--bad-soft);border-radius:10px;padding:10px 14px}
.watch .eyebrow{color:var(--bad)}
.watch ul{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.field.wide{grid-column:1/-1}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.key{font-family:var(--f-math);font-size:16px;min-width:40px;padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.key:hover{border-color:var(--accent)}
.preview{color:var(--muted);font-size:15px;min-height:1.4em}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.2}
.fr > span:first-child{border-bottom:1.5px solid currentColor;padding:0 6px 2px}
.fr > span:last-child{padding:2px 6px 0}
.banwrap{padding-block:0}
.banwrap:not([hidden]){padding-block:16px 0}
.banner{display:flex;flex-direction:column;gap:4px;background:var(--bad-soft);border:2px solid var(--bad);border-radius:12px;padding:12px 16px;color:var(--ink)}
.banner strong{color:var(--bad);font-size:17px}
.who{margin:6px 0 0;color:var(--muted);font-size:14px}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:700;text-decoration:underline}
.login{max-width:440px}
.lsteps{margin:4px 0 8px;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.login .field input{font-family:var(--f-body);font-size:18px}
@media (prefers-reduced-motion:no-preference){.card{animation:in .25s ease-out}@keyframes in{from{transform:translateY(6px)}to{transform:none}}}
@media (max-width:480px){.card{padding:16px}.row{grid-template-columns:40px 1fr;}.row .chip{grid-column:2;justify-self:start}}
</style>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<body>
<div class="wrap banwrap" id="banner" aria-live="polite"></div>
<div class="wrap" id="app"></div>

<script>
// GEN-START
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const nz=(a,b)=>{let v;do v=ri(a,b);while(v===0);return v};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};
const neg=n=>n<0?'−'+Math.abs(n):String(n);
const par=n=>n<0?'('+neg(n)+')':String(n);
function frac(n,d=1){if(d<0){n=-n;d=-d}const g=gcd(n,d);n/=g;d/=g;if(d===1)return neg(n);return (n<0?'−':'')+Math.abs(n)+'/'+d}
function poly(terms){let s='';for(const [c,v] of terms){if(c===0)continue;const a=Math.abs(c);const cs=(a===1&&v)?'':String(a);if(s===''){s=(c<0?'−':'')+cs+v}else{s+=(c<0?' − ':' + ')+cs+v}}return s||'0'}
const lead=a=>a===1?'':a===-1?'−':neg(a);
const sh=h=>h===0?'x':`(x ${h>0?'−':'+'} ${Math.abs(h)})`;
const kterm=k=>k===0?'':` ${k>0?'+':'−'} ${Math.abs(k)}`;
const vform=(a,h,k)=>lead(a)+(h===0?'x²':sh(h)+'²')+kterm(k);
function fform(a,p,q){if(q===0&&p!==0)[p,q]=[q,p];return lead(a)+sh(p)+sh(q)}
const std=(a,b,c)=>poly([[a,'x²'],[b,'x'],[c,'']]);
const lin=(m,b)=>poly([[m,'x'],[b,'']]);
const M=s=>`<span class="m">${s.replace(/(?<![A-Za-z])([a-z])(?![A-Za-z])/g,'<i>$1</i>')}</span>`;
const EQ=s=>`<div class="eq">${M(s)}</div>`;
const pt=(x,y)=>M(`(${neg(x)}, ${neg(y)})`);
const F=(label,n,d=1)=>({label,ans:n/d,disp:frac(n,d)});
function mc(correct,distractors){const o=[correct];for(const d of distractors){if(!o.includes(d)&&o.length<4)o.push(d)}const s=shuffle(o);return {choices:s,correct:s.indexOf(correct)}}
const evalStr=(a,b,c,x)=>`${neg(a)}·${par(x)}² + ${par(b)}·${par(x)} + ${par(c)}`;
const pw=(name,rows)=>`<div class="eq"><div class="pw">${M(name+' =')}<span class="pw-b">${rows.map(([e,c])=>`${M(e)}<span class="pw-c">if ${M(c)}</span>`).join('')}</span></div></div>`;

let gid=0;
function graph({curves=[],dots=[]}){
  const R=8,S=18,P=16,W=2*R*S,T=W+2*P,id='clip'+(++gid);
  const X=x=>P+(x+R)*S, Y=y=>P+(R-y)*S;
  let g='';
  for(let i=-R;i<=R;i++){g+=`<line class="g-grid" x1="${X(i)}" y1="${Y(R)}" x2="${X(i)}" y2="${Y(-R)}"/><line class="g-grid" x1="${X(-R)}" y1="${Y(i)}" x2="${X(R)}" y2="${Y(i)}"/>`}
  g+=`<line class="g-axis" x1="${X(-R)}" y1="${Y(0)}" x2="${X(R)}" y2="${Y(0)}"/><line class="g-axis" x1="${X(0)}" y1="${Y(R)}" x2="${X(0)}" y2="${Y(-R)}"/>`;
  for(let i=-R+2;i<=R-2;i+=2){if(!i)continue;g+=`<text class="g-lbl" x="${X(i)}" y="${Y(0)+13}" text-anchor="middle">${neg(i)}</text><text class="g-lbl" x="${X(0)-5}" y="${Y(i)+3.5}" text-anchor="end">${neg(i)}</text>`}
  let paths='';
  for(const c of curves){let d='',pen=false;const n=240;for(let j=0;j<=n;j++){const x=c.x0+(c.x1-c.x0)*j/n,y=c.f(x);if(Math.abs(y)>R+3){pen=false;continue}d+=(pen?'L':'M')+X(x).toFixed(1)+' '+Y(y).toFixed(1);pen=true}paths+=`<path class="g-curve" d="${d}"/>`}
  const dd=dots.map(p=>`<circle class="${p.open?'g-open':'g-dot'}" cx="${X(p.x)}" cy="${Y(p.y)}" r="4.5"/>`).join('');
  return `<svg class="graph" viewBox="0 0 ${T} ${T}" role="img" aria-label="Coordinate graph from −8 to 8 on both axes"><defs><clipPath id="${id}"><rect x="${P}" y="${P}" width="${W}" height="${W}"/></clipPath></defs>${g}<g clip-path="url(#${id})">${paths}</g>${dd}</svg>`;

const SUPD={'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9'};

function tok(s){
  s=String(s).replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g,m=>'^'+m.split('').map(c=>SUPD[c]).join('')).replace(/[−–—]/g,'-').replace(/[·×∙]/g,'*').replace(/\*\*/g,'^').replace(/\s+/g,'');

}

  const T=()=>{let a=U();while(pk()&&(pk().k==='*'||pk().k==='/')){const o=t[p++].k;a=[o,a,U()]}return a};
  const U=()=>{if(pk()&&pk().k==='-'){p++;return ['neg',U()]}if(pk()&&pk().k==='+'){p++;return U()}return W()};

RV.discType=W('3.9',GEN3['3.9'][1]);
const discABC=kind=>{let a,b,c,D;for(;;){a=pick([1,1,2,3,-1,-2]);b=ri(-10,10);c=nz(-12,12);D=b*b-4*a*c;const sq=D>0&&Number.isInteger(Math.sqrt(D));
  if(kind==='rat2'&&sq||kind==='irr2'&&D>0&&!sq||kind==='imag'&&D<0)return [a,b,c,D];
  if(kind==='one'){const r=nz(-6,6);a=pick([1,1,4,9]);const s=Math.sqrt(a);return [a,-2*s*r,r*r,0]}}};
const DL={rat2:'2 real rational solutions',irr2:'2 real irrational solutions',one:'1 real solution (a double root)',imag:'2 complex (imaginary) solutions'};
RV.discX4=()=>shuffle(['imag','one','rat2','irr2']).map(kind=>{const [a,b,c,D]=discABC(kind),n=D>0?2:D===0?1:0;
  return {sec:'3.9',prompt:`Calculate the discriminant. Then state how many x-intercepts the graph of ${M(`y = ${std(a,b,c)}`)} has.`,eq:`${std(a,b,c)} = 0`,
  fields:[F('discriminant b² − 4ac',D),F('number of x-intercepts',n)],
  hint:`${M('D = b² − 4ac')}. Positive: 2 real solutions and 2 x-intercepts. Zero: 1 of each. Negative: 2 complex solutions and no x-intercepts.`,
  steps:[M(`D = ${par(b)}² − 4·${par(a)}·${par(c)} = ${neg(D)}`),`Type: ${DL[kind]}.`,`x-intercepts: ${n}${n===0?' (complex solutions never touch the x-axis)':''}.`]}});
RV.kRange=()=>{const [p,q]=pick([[4,4],[1,9],[9,1],[2,8],[3,3],[1,16],[9,4],[5,5],[1,25],[4,9]]),B=2*Math.sqrt(p*q),Bw=Math.sqrt(p*q);
  const right=`Zero real: ${M(`−${B} &lt; k &lt; ${B}`)} · One real: ${M(`k = ±${B}`)} · Two real: ${M(`k &lt; −${B}`)} or ${M(`k &gt; ${B}`)}`;
  const res=mc(right,[`Zero real: ${M(`k &lt; ${B}`)} · One real: ${M(`k = ${B}`)} · Two real: ${M(`k &gt; ${B}`)}`,
    `Zero real: ${M(`k &lt; −${B}`)} or ${M(`k &gt; ${B}`)} · One real: ${M(`k = ±${B}`)} · Two real: ${M(`−${B} &lt; k &lt; ${B}`)}`,
    `Zero real: ${M(`−${Bw} &lt; k &lt; ${Bw}`)} · One real: ${M(`k = ±${Bw}`)} · Two real: ${M(`k &lt; −${Bw}`)} or ${M(`k &gt; ${Bw}`)}`]);
  return {type:'mc',sec:'3.9',prompt:`Find the values of ${M('k')} that give the equation zero real solutions, one real solution, or two real solutions.`,eq:`${p===1?'':p}x² + kx + ${q} = 0`,...res,
  hint:`${M(`D = k² − 4·${p}·${q} = k² − ${4*p*q}`)}. One real solution when ${M('D = 0')}. Remember ${M('k')} can be negative too.`,
  steps:[M(`D = k² − ${4*p*q}`),`One real: ${M(`k² = ${4*p*q}`)}, so ${M(`k = ±${B}`)}.`,`Zero real (D &lt; 0): ${M(`k²`)} smaller than ${M(String(4*p*q))}, so ${M(`−${B} &lt; k &lt; ${B}`)}.`,`Two real (D &gt; 0): ${M(`k &lt; −${B}`)} or ${M(`k &gt; ${B}`)}.`]}};
RV.revenue=()=>{const a=pick([0.5,1,2,4]),b=pick([100,120,160,200,240,300,400]),mx=b*b/(4*a),u=10**(Math.floor(Math.log10(mx))-1),yes=Math.random()<.5;
  let T=yes?Math.floor(mx*.85/u)*u:Math.ceil(mx*1.2/u)*u;const D=b*b-4*a*T,money=v=>'$'+v.toLocaleString('en-US');
  const yesTxt=`Yes. Setting ${M(`R = ${T}`)} gives a positive discriminant, so there are real values of ${M('x')} that reach it.`,noTxt=`No. Setting ${M(`R = ${T}`)} gives a negative discriminant, so ${M('R')} never reaches it.`;
  const res=mc(yes?yesTxt:noTxt,[yes?noTxt:yesTxt,`Yes. Revenue keeps growing as more items are sold.`,`No. Revenue can never be more than ${money(b)}.`]);
  return {type:'mc',sec:'3.9',prompt:`A small business's revenue this year is given by ${M(`R = −${a===1?'':a}x² + ${b}x`)}. Can the revenue be at least ${money(T)} this year?`,...res,
  hint:`Set ${M(`−${a===1?'':a}x² + ${b}x = ${T}`)}, move everything to one side, and check the discriminant.`,
  steps:[M(`${a===1?'':a}x² − ${b}x + ${T} = 0`),M(`D = ${b}² − 4·${a}·${T} = ${neg(D)}`),D>=0?`${M('D')} is not negative, so yes.`:`${M('D')} is negative, so no.`,`Check: the most revenue possible is at the vertex, ${M(`x = ${b/(2*a)}`)}, which gives ${money(mx)}.`]}};
RV.never=()=>{let a,b,c,D;do{a=pick([-1,-1,-2,-3,1,2]);b=nz(-8,8);c=a<0?nz(-12,-1):ri(1,12);D=b*b-4*a*c}while(D>=0);const dir=a<0?'downward':'upward';
  const res=mc(`${M(`D = ${neg(D)}`)}. It is negative, so ${M(`${std(a,b,c)} = 0`)} has no real solutions, which means no x-intercepts.`,
   [`Because it opens ${dir}, it can never reach the x-axis.`,`${M(`D = ${-D}`)}. It is positive, so the graph has no x-intercepts.`,`Because the constant ${M(neg(c))} is ${c<0?'negative':'positive'}, the graph cannot cross the x-axis.`]);
  return {type:'mc',sec:'3.9',prompt:`The parabola ${M(`y = ${std(a,b,c)}`)} opens ${dir}. Which reason uses the discriminant to explain why its graph never touches the x-axis?`,...res,
  hint:`x-intercepts are the real solutions of ${M(`${std(a,b,c)} = 0`)}. Find ${M('b² − 4ac')}.`,
  steps:[M(`D = ${par(b)}² − 4·${par(a)}·${par(c)} = ${neg(D)}`),`Negative discriminant → only complex solutions → no x-intercepts.`,`Opening up or down alone does not decide it; the vertex position does, and the discriminant tells you that.`]}};
RV.kOne=()=>{if(Math.random()<.6){const b=nz(-12,12);
  return {sec:'3.9',prompt:`For what value of ${M('k')} does the equation have exactly one real solution? A fraction is fine.`,eq:`${std(1,b,0)} + k = 0`,fields:[F('k',b*b,4)],
   hint:`Exactly one real solution means ${M('b² − 4ac = 0')}.`,steps:[M(`${par(b)}² − 4·1·k = 0`),M(`${b*b} = 4k`),M(`k = ${frac(b*b,4)}`)]}}
  const s=ri(2,9);
  return {sec:'3.9',prompt:`For what positive value of ${M('k')} does the equation have exactly one real solution?`,eq:`x² + kx + ${s*s} = 0`,fields:[F('k',2*s)],
   hint:`Exactly one real solution means ${M('b² − 4ac = 0')}.`,steps:[M(`k² − 4·1·${s*s} = 0`),M(`k² = ${4*s*s}`),M(`k = ±${2*s}`),`The positive value is ${M(String(2*s))}.`]}};

/* factoring cubes */
RV.f2a=W('3.6',GEN3['3.6'][4]);
const gcfCube=s=>()=>{let k,a,b;do{k=pick([2,3,5,6]);a=ri(2,5);b=ri(1,3)}while(gcd(a,b)!==1);const o=s<0?'−':'+';
  const disp=`${k}(${a}x ${o} ${b})(${pd([b*b,-s*a*b,a*a])})`;
  return {sec:'3.6',prompt:`Factor completely.`,eq:poly([[k*a**3,'x³'],[s*k*b**3,'']]),fields:[EX('factored form',`${k}*(${a}x${s<0?'-':'+'}${b})*(${a*a}x^2${s<0?'+':'-'}${a*b}x+${b*b})`,disp,'factored',2)],
  hint:`Take out the GCF ${M(String(k))} first. What is left is a ${s<0?'difference':'sum'} of cubes. SOAP: Same sign, Opposite sign, Always Positive.`,
  steps:[M(`${k}(${poly([[a**3,'x³'],[s*b**3,'']])})`),M(`${pd([0,0,0,a**3])} = (${a}x)³,  ${b**3} = ${b}³`),M(disp)]}};
RV.f2b=gcfCube(-1);RV.f2e=gcfCube(1);
RV.f2c=()=>{const k=pick([2,3,4,5]),b=pick([2,3]),s=pick([1,-1]),o=s<0?'−':'+';
  const disp=`${k}xy(x ${o} ${b}y)(${poly([[1,'x²'],[-s*b,'xy'],[b*b,'y²']])})`;
  return {sec:'3.6',prompt:`Factor completely.`,eq:poly([[k,'x⁴y'],[s*k*b**3,'xy⁴']]),fields:[EX('factored form',`${k}x*y*(x${s<0?'-':'+'}${b}y)*(x^2${s<0?'+':'-'}${b}xy+${b*b}y^2)`,disp,'factored',4)],
  hint:`The GCF is ${M(`${k}xy`)}. Take it out, then factor the ${s<0?'difference':'sum'} of cubes that is left.`,
  steps:[M(`${k}xy(${poly([[1,'x³'],[s*b**3,'y³']])})`),M(`${b**3}y³ = (${b}y)³`),M(disp)]}};
RV.f2d=()=>{const b=ri(2,6);
  return {sec:'3.6',prompt:`Factor completely.`,eq:`x³ + ${b**3}`,fields:[EX('factored form',`(x+${b})(x^2-${b}x+${b*b})`,`(x + ${b})(${pd([b*b,-b,1])})`,'factored',2)],
  hint:`Sum of cubes: ${M('a³ + b³ = (a + b)(a² − ab + b²)')}. ${M(String(b**3))} is ${M(`${b}³`)}.`,
  steps:[M(`a = x,  b = ${b}`),M(`(x + ${b})(${pd([b*b,-b,1])})`)]}};
RV.f2f=()=>{let a,b;do{a=ri(1,3);b=ri(1,4)}while(gcd(a,b)!==1||(a===1&&b===1));const A=a===1?'x':a+'x';
  const disp=`(${A}y² + ${b})(${a*a===1?'':a*a}x²y⁴ − ${a*b===1?'':a*b}xy² + ${b*b})`;
  return {sec:'3.6',prompt:`Factor completely.`,eq:poly([[a**3,'x³y⁶'],[b**3,'']]),fields:[EX('factored form',`(${a}x*y^2+${b})(${a*a}x^2*y^4-${a*b}x*y^2+${b*b})`,disp,'factored',2)],
  hint:`${M(poly([[a**3,'x³y⁶']]))} is a perfect cube: ${M(`(${A}y²)³`)}. Then use the sum of cubes pattern.`,
  steps:[M(`${poly([[a**3,'x³y⁶']])} = (${A}y²)³,  ${b**3} = ${b}³`),M(disp)]}};

 rev3a:[RV.p1q1,RV.p1q2,RV.cxSub,RV.cxDist,RV.cxMul,RV.cxRealDiv,RV.cxDivI,RV.cxConj,RV.sqImag,RV.sqFrac,RV.sqIrr,
   RV.ctsP,RV.ctsFracPos,RV.ctsFracNeg,RV.ctsBoth,RV.qfIrr,RV.qfCx,RV.two1,RV.two2,RV.discType,RV.discType,RV.kRange,RV.revenue],
 rev3b:[RV.p2q1,RV.f2a,RV.f2b,RV.f2c,RV.f2d,RV.f2e,RV.f2f,RV.ctsInt,RV.ctsFracPos,RV.ctsCx,RV.vertex,
   RV.cxAdd,RV.cxSub,RV.cxMul,RV.cxDivClean,RV.cxRealDiv,RV.cxConj,RV.discX4,RV.never,RV.kOne],
};

/* ---- Sign rules practice: 4 questions on each of the 5 sign rules ---- */
REVIEW_NAMES.sign3='Sign rules practice';
REVIEW_DESC.sign3='20 quick questions on the 5 sign rules: subtracting, multiplying, cubes (SOAP), dividing complex numbers, completing the square';
const REVIEW_TAG={rev3a:'R1',rev3b:'R2',sign3:'±'};
const SG={};
const R1H=`Rule 1: a minus in front of parentheses flips the sign of EVERY term inside, even terms with nothing to combine with.`;
const R2H=`Rule 2: carry each term's sign with it. (−)(−) = +, (−)(+) = −.`;
const R3H=`Rule 3, SOAP: the binomial has the Same sign, the middle of the trinomial is the Opposite sign, the last term is Always Positive.`;
const R4H=`Rule 4: multiply top and bottom by the conjugate (flip only the sign of the i part), and keep the top's own sign. i² = −1.`;
// Rule 1: subtracting
SG.neg=()=>{let A;do A=rpoly(ri(2,3),.2,9);while(nterms(A)<3);const N=psc(A,-1);
  return {sec:'3.1',prompt:`Remove the parentheses.`,eq:`−(${pd(A)})`,fields:[EX('answer',pa(N),pd(N),'expanded')],hint:R1H,
  steps:[`Flip each sign: ${A.map((c,i)=>c?`${M(pd(mono(c,i)))} → ${M(pd(mono(-c,i)))}`:'').filter(Boolean).reverse().join(', ')}`,M(pd(N))]}};
SG.subUnpaired=()=>{let A,B,S;do{A=rpoly(ri(3,4),.4);B=rpoly(ri(2,4),.4);S=padd(A,psc(B,-1))}while(!B.some((c,i)=>c&&!A[i])||nterms(S)<3);
  const un=B.map((c,i)=>c&&!A[i]?M(pd(mono(-c,i))):'').filter(Boolean);
  return {sec:'3.1',prompt:`Subtract.`,eq:`(${pd(A)}) − (${pd(B)})`,fields:[EX('answer',pa(S),pd(S),'expanded')],hint:R1H,
  steps:[M(`${pd(A)} + (${pd(psc(B,-1))})`),`Terms with no partner still flip: ${un.join(', ')}.`,`Combine: ${M(pd(S))}`]}};
SG.cfm=()=>{const f=[nz(-9,9),nz(-6,6)],m=[nz(-9,9),nz(-9,9),nz(-4,4)],c=pick([2,3,4]),A=padd(psc(f,c),psc(m,-1));
  return {sec:'3.1',prompt:`If ${M(`f(x) = ${pd(f)}`)} and ${M(`m(x) = ${pd(m)}`)}, find ${M(`${c}f(x) − m(x)`)}.`,fields:[EX(`${c}f(x) − m(x)`,pa(A),pd(A),'expanded')],hint:R1H,
  steps:[M(`${c}f(x) = ${pd(psc(f,c))}`),M(`${pd(psc(f,c))} + (${pd(psc(m,-1))})`),M(`= ${pd(A)}`)]}};
SG.firstStep=()=>{const a=nz(-6,6),b=nz(-6,6),c=nz(-9,9),d=nz(-6,6),e=nz(-6,6),f=nz(-9,9);
  const L=`${pd([c,b,a])}`,t=(x,y,z)=>`${L} ${x<0?'−':'+'} ${pd([0,0,Math.abs(x)])} ${y<0?'−':'+'} ${pd([0,Math.abs(y)])} ${z<0?'−':'+'} ${Math.abs(z)}`;
  const res=mc(M(t(-d,-e,-f)),[M(t(-d,e,f)),M(t(-d,-e,f)),M(t(d,e,f)),M(t(-d,e,-f))]);
  return {type:'mc',sec:'3.1',prompt:`Which is the correct way to remove the parentheses?`,eq:`(${pd([c,b,a])}) − (${pd([f,e,d])})`,...res,hint:R1H,
  steps:[`Every term of ${M(`(${pd([f,e,d])})`)} flips: ${M(pd([0,0,d]))} → ${M(pd([0,0,-d]))}, ${M(pd([0,e]))} → ${M(pd([0,-e]))}, ${M(neg(f))} → ${M(neg(-f))}.`,M(t(-d,-e,-f))]}};
// Rule 2: multiplying
SG.monoMul=()=>{const k=-ri(2,6),e=ri(0,2),T=[nz(-9,9),nz(-7,7),nz(-5,5)],P=pmul(mono(k,e),T);
  return {sec:'3.1',prompt:`Multiply.`,eq:`(${pd(mono(k,e))})(${pd(T)})`,fields:[EX('answer',pa(P),pd(P),'expanded')],hint:R2H,
  steps:[2,1,0].map(i=>M(`(${pd(mono(k,e))})·(${pd(mono(T[i],i))}) = ${pd(mono(k*T[i],i+e))}`)).concat([M(pd(P))])}};
SG.coefX2=()=>{const g=[nz(-9,9),nz(-5,5)],f=[nz(-9,9),nz(-7,7),nz(-4,4)],P=pmul(g,f);
  return {sec:'3.1',prompt:`Without multiplying everything out, find the coefficient of ${M('x²')} in the product.`,eq:`(${pd(g)})(${pd(f)})`,fields:[F('coefficient of x²',P[2])],
  hint:`${M('x²')} comes from two products: ${M('(x term)·(x term)')} and ${M('(number)·(x² term)')}. ${R2H}`,
  steps:[M(`${pd([0,g[1]])}·${pd([0,f[1]])} = ${pd([0,0,g[1]*f[1]])}`),M(`${neg(g[0])}·${pd([0,0,f[2]])} = ${pd([0,0,g[0]*f[2]])}`),M(`${par(g[1]*f[1])} + ${par(g[0]*f[2])} = ${neg(P[2])}`)]}};
SG.binTri=()=>{const g=[nz(-9,9),-ri(1,5)*pick([1,-1])],f=[nz(-9,9),nz(-7,7),-ri(1,4)],P=pmul(g,f);
  return {sec:'3.1',prompt:`Multiply.`,eq:`(${pd(g)})(${pd(f)})`,fields:[EX('answer',pa(P),pd(P),'expanded')],hint:R2H,
  steps:[M(`${pd([0,g[1]])}·(${pd(f)}) = ${pd(pmul([0,g[1]],f))}`),M(`${neg(g[0])}·(${pd(f)}) = ${pd(pmul([g[0]],f))}`),`Combine: ${M(pd(P))}`]}};
SG.monos=()=>{const n=pick([2,3]),cs=Array.from({length:n},()=>-ri(1,6)*(Math.random()<.75?1:-1)),es=cs.map(()=>ri(1,3)),C=cs.reduce((a,b)=>a*b,1),E=es.reduce((a,b)=>a+b,0);
  const negs=cs.filter(c=>c<0).length;
  return {sec:'3.1',prompt:`Simplify.`,eq:cs.map((c,i)=>`(${pd(mono(c,es[i]))})`).join(''),fields:[EX('answer',pa(mono(C,E)),pd(mono(C,E)),'expanded')],
  hint:`Count the negative signs: an even number gives +, an odd number gives −. Multiply the numbers and add the exponents.`,
  steps:[`${negs} negative sign${negs===1?'':'s'} → the answer is ${negs%2?'negative':'positive'}.`,M(`${cs.map(c=>Math.abs(c)).join('·')} = ${Math.abs(C)},  exponents ${es.join(' + ')} = ${E}`),M(pd(mono(C,E)))]}};
// Rule 3: SOAP
SG.soapFill=()=>{let a,b;do{a=ri(1,4);b=ri(1,5)}while(gcd(a,b)!==1||(a===1&&b===1));const s=pick([1,-1]),A=a===1?'x':a+'x';
  const f=(p,q,r)=>M(`(${A} ${p} ${b})(${a*a===1?'':a*a}x² ${q} ${a*b===1?'':a*b}x ${r} ${b*b})`);
  const good=s<0?f('−','+','+'):f('+','−','+');
  const res=mc(good,[f('−','−','+'),f('+','+','+'),f(s<0?'+':'−',s<0?'−':'+','+'),f(s<0?'−':'+',s<0?'+':'−','−')].filter(x=>x!==good));
  return {type:'mc',sec:'3.6',prompt:`Which factoring has the correct signs?`,eq:poly([[a**3,'x³'],[s*b**3,'']]),...res,hint:R3H,
  steps:[`Same sign as the original: ${M(`(${A} ${s<0?'−':'+'} ${b})`)}.`,`Opposite sign in the middle: ${M(s<0?'+':'−')}.`,`Always positive at the end: ${M('+ '+b*b)}.`,good]}};
SG.cubeDiff=W('3.6',GEN3['3.6'][4]);
SG.cubeSum=RV.f2d;
SG.cubeGCF=()=>pick([RV.f2b,RV.f2e])();
// Rule 4: complex division
SG.conj=W('3.3',GEN3['3.3'][5]);
SG.topMul=()=>{const n=-ri(2,9)*(Math.random()<.8?1:-1),c=nz(-6,6),d=nz(-6,6);
  return {sec:'3.3',prompt:`To divide ${M(neg(n))} by ${M(cx(c,d))}, you multiply the top by the conjugate. What is the new top? ${CXP}`,eq:`${par(n)}(${cx(c,-d)})`,fields:C2(n*c,-n*d),hint:R4H,
  steps:[M(`${par(n)}·${par(c)} = ${neg(n*c)}`),M(`${par(n)}·(${cx(0,-d)}) = ${cx(0,-n*d)}`),M(cx(n*c,-n*d))]}};
SG.realDiv=RV.cxRealDiv;
SG.iSq=W('3.3',GEN3['3.3'][6]);
// Rule 5: completing the square and squaring negatives
SG.move=()=>{const a=pick([2,3,4,5]),m=nz(-6,6);let c;do c=nz(-40,40);while(c%a===0);
  return {sec:'3.7',prompt:`First steps of completing the square: divide by ${M(String(a))} and move the constant to the right side. What number is on the right? A fraction is fine.`,eq:`${std(a,a*m,c)} = 0`,
  fields:[F(`${std(1,m,0)} =`,-c,a)],hint:`Dividing keeps the sign. Moving a term to the other side flips its sign.`,
  steps:[`Divide by ${M(String(a))}: ${M(`${std(1,m,0)} + ${frac(c,a)} = 0`.replace('+ −','− '))}`,`Move ${M(frac(c,a))} over, so its sign flips: ${M(`${std(1,m,0)} = ${frac(-c,a)}`)}`]}};
SG.addHalf=W('3.7',GEN3['3.7'][4]);
SG.negSq=()=>{const k=ri(2,7),v=pick([0,1,2]);let eq,val,st;
  if(v===0){eq='−x²';val=-k*k;st=[M(`−(−${k})² = −(${k*k}) = ${neg(val)}`),`Square first, then apply the minus in front.`]}
  else if(v===1){const b=nz(-6,6);eq=std(1,b,0);val=k*k-b*k;st=[M(`(−${k})² ${b<0?'−':'+'} ${Math.abs(b)}·(−${k})`),M(`${k*k} ${-b*k<0?'−':'+'} ${Math.abs(b*k)} = ${neg(val)}`)]}
  else{const a=-ri(1,3),b=nz(-6,6);eq=std(a,b,0);val=a*k*k-b*k;st=[M(`${neg(a)}·(−${k})² + ${par(b)}·(−${k})`),M(`${neg(a)}·${k*k} ${-b*k<0?'−':'+'} ${Math.abs(b*k)} = ${neg(val)}`)]}
  return {sec:'3.9',prompt:`Evaluate when ${M(`x = −${k}`)}.`,eq,fields:[F('value',val)],
  hint:`Put the negative number in parentheses: ${M(`(−${k})² = ${k*k}`)}, a positive number. A minus sign in front of ${M('x²')} is applied after squaring.`,steps:st}};
SG.disc=W('3.9',GEN3['3.9'][0]);
REVIEWS.sign3=[SG.neg,SG.subUnpaired,SG.cfm,SG.firstStep, SG.monoMul,SG.coefX2,SG.binTri,SG.monos, SG.soapFill,SG.cubeDiff,SG.cubeSum,SG.cubeGCF, SG.conj,SG.topMul,SG.realDiv,SG.iSq, SG.move,SG.addHalf,SG.negSq,SG.disc];
function makeSet(sec){
  if(REVIEWS[sec]){const out=[];for(const g of REVIEWS[sec]){const r=g();(Array.isArray(r)?r:[r]).forEach(q=>out.push(q))}return out}
  if(sec==='test'||sec==='test3'||sec==='test4'){const u={test:'2',test3:'3',test4:'4'}[sec];const out=[];for(const s of SECTIONS.filter(x=>x.unit===u)){shuffle(GEN[s.id]).slice(0,2).forEach(g=>out.push({...g(),sec:s.id}))}return out}
  const gens=shuffle(GEN[sec]);const out=[];for(let i=0;i<6;i++)out.push({...gens[i%gens.length](),sec});return out;
}
function parseNum(s){s=String(s).trim().replace(/[−–]/g,'-').replace(/\s+/g,'');if(!s)return NaN;
  if(/^[-+]?\d*\.?\d+\/[-+]?\d*\.?\d+$/.test(s)){const [a,b]=s.split('/');return +a/+b}
  if(/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s))return +s;return NaN}
function matches(v,ans){return Math.abs(v-ans)<1e-9||(!Number.isInteger(ans)&&Math.abs(v-ans)<=0.006)}

const CONCEPTS4={
'4.1':{big:`A polynomial is in standard form when its terms go from the largest exponent to the smallest. The first term tells you the degree and the leading coefficient, and those two facts decide the end behavior: what the graph does far to the left and far to the right.`,
 rules:[['Degree','the largest exponent'],['Leading coefficient','the number in front of the term with the largest exponent'],['Odd degree','the ends go in opposite directions. Positive leading coefficient: down on the left, up on the right. Negative: up on the left, down on the right.'],['Even degree','both ends go the same way. Positive leading coefficient: both up. Negative: both down.'],['y-intercept','the constant term (the value when '+M('x = 0')+')']],
 ex:{q:`What is the end behavior of ${M('f(x) = 2x + 5x⁴ − x³ + 1')}?`,steps:[`Standard form: ${M('5x⁴ − x³ + 2x + 1')}`,`The degree is 4 (even) and the leading coefficient is 5 (positive).`,`Even and positive: both ends go up.`]},
 watch:[`Put the terms in order BEFORE you pick the degree and leading coefficient. The first term you see is not always the biggest.`,`A negative leading coefficient flips the graph upside down: ${M('−x²')} opens down.`,`For a product like ${M('(x + 1)(2x − 3)')}, the degree comes from adding the exponents and the leading coefficient from multiplying the front numbers.`]},
'4.2':{big:`The key features of a polynomial graph are its domain and range, where it is increasing or decreasing, where it is positive or negative, its end behavior, and its turning points. You can sketch a graph from these features.`,
 rules:[['Turning points','a polynomial of degree '+M('n')+' has at most '+M('n − 1')+' turning points'],['Domain','all real numbers, for every polynomial'],['Range','odd degree: all real numbers. Even degree: starts or stops at the lowest or highest point.'],['Positive / negative','above / below the x-axis. The sign can only change at an x-intercept.'],['Increasing / decreasing','going uphill / downhill as you read left to right. It switches at the turning points.']],
 ex:{q:`A graph is positive on ${M('(−4, 1) ∪ (7, ∞)')} and negative on ${M('(−∞, −4) ∪ (1, 7)')}. What is the smallest possible degree?`,steps:[`The sign changes at ${M('−4')}, ${M('1')} and ${M('7')}: 3 zeros.`,`Each crossing needs at least one factor, so the degree is at least 3.`]},
 watch:[`Use parentheses for intervals of positive/negative and of increasing/decreasing. The function is 0 at the x-intercepts, so they are not included.`,`Intervals are x-values (left to right), but the range is made of y-values.`,`"At most ${M('n − 1')} turning points" means the real count can be smaller.`]},
'4.3':{big:`Dividing polynomials works like dividing numbers. If the divisor is a single term, divide every term. Otherwise use long division: divide, multiply, subtract, bring down, and repeat. If the remainder is 0, the divisor and the quotient are both factors.`,
 rules:[['Single-term divisor','divide each term: divide the numbers and subtract the exponents'],['Long division','divide the first terms, multiply back across the divisor, subtract, bring down the next term'],['The relationship','dividend = divisor × quotient + remainder'],['With a remainder','dividend ÷ divisor = quotient + remainder/divisor'],['Remainder 0','dividend = (divisor)(quotient), so both are factors']],
 ex:{q:`Divide ${M('(x² − 7x + 10) ÷ (x − 5)')}.`,steps:[`${M('x² ÷ x = x')}. Multiply: ${M('x(x − 5) = x² − 5x')}. Subtract: ${M('−2x + 10')}.`,`${M('−2x ÷ x = −2')}. Multiply: ${M('−2(x − 5) = −2x + 10')}. Subtract: 0.`,`Quotient ${M('x − 2')}, remainder 0, so ${M('x² − 7x + 10 = (x − 5)(x − 2)')}.`]},
 watch:[`When you subtract, change the sign of EVERY term you subtract.`,`Remainder goes over the divisor: ${M('x + 3 + 4/(x − 2)')}, not just ${M('+ 4')}.`,`The divisor must be exactly what you divide by: ${M('(x − 5)')} is not ${M('(x + 5)')}.`]},
'4.4':{big:`Long division gets harder in three ways. The terms can be out of order, powers can be missing, or the divisor can have three terms. The method is the same once the setup is right.`,
 rules:[['Out of order','rewrite the dividend and the divisor in descending order first'],['Missing powers','fill each hole with a placeholder like '+M('0x²')+' so the columns line up'],['Three-term divisor','no problem: divide the first terms, then multiply back across ALL three terms'],['Writing as a product','if the remainder is 0, dividend = (divisor)(quotient). Keep factoring the quotient if you can.']],
 ex:{q:`Divide ${M('(x³ − 8) ÷ (x − 2)')}.`,steps:[`Add placeholders: ${M('x³ + 0x² + 0x − 8')}.`,`${M('x³ ÷ x = x²')}, subtract, then ${M('2x² ÷ x = 2x')}, subtract, then ${M('4x ÷ x = 4')}, subtract.`,`Quotient ${M('x² + 2x + 4')}, remainder 0.`]},
 watch:[`Every missing power needs a placeholder, in the dividend AND in the divisor.`,`Line up like terms in columns, and keep the minus signs when you subtract.`,`Stop when the degree of what is left is smaller than the degree of the divisor. That leftover is the remainder.`]},
'4.5':{big:`Synthetic division is a shortcut for dividing by ${M('(x − k)')}. You only write the coefficients, so it is faster than long division. It also checks for zeros quickly: a remainder of 0 means ${M('k')} is a zero.`,

    </section>`}).join('')}</div>
  <div class="test" style="margin-top:20px"><div><h2>Ready?</h2><p>Take the ${U.name} practice test: ${secs.length*2} questions from every lesson.</p></div><button class="btn" data-go="${U.test}">Start test</button></div>`;
  document.getElementById('back').onclick=home;
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>start(b.dataset.go));
  app.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>document.getElementById('c-'+b.dataset.jump.replace('.','-')).scrollIntoView({behavior:'smooth',block:'start'}));
  if(jump){const el=document.getElementById('c-'+jump.replace('.','-'));if(el)el.scrollIntoView();}else window.scrollTo(0,0);
  logRead(u);trackConcepts(u);
}

/* ---- quiz ---- */
function start(sec){leaveConcepts();S={sec,qs:makeSet(sec),i:0,res:[],items:[],started:Date.now(),ref:null};VIEW='quiz';show();window.scrollTo(0,0)}
const KEYS=[['^2','x²'],['^3','x³'],['^','^'],['(','('],[')',')']];
function fieldHTML(f,j){
  if(f.kind==='expr'){const keys=KEYS.concat(/y/.test(f.ans)?[['y','y']]:[]);
    return `<div class="field wide"><label for="f${j}">${f.label}</label><input id="f${j}" class="exin" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${f.mode==='factored'?'e.g. 2(x+3)(x-1)':'e.g. 3x^2-5x+2'}">
    <div class="keys">${keys.map(([ins,lab])=>`<button type="button" class="key" data-ins="${esc(ins)}" data-for="f${j}">${lab}</button>`).join('')}</div><div class="preview" id="pv${j}" aria-live="polite"></div></div>`}
  return `<div class="field"><label for="f${j}">${f.label}</label><input id="f${j}" type="text" autocomplete="off" spellcheck="false" inputmode="text"></div>`;
}
function show(){
  const q=S.qs[S.i];S.tries=0;S.pick=null;S.done=false;S.wrong=[];S.hinted=false;S.peeked=false;
  const n=S.qs.length;
  app.innerHTML=`
  <div class="bar"><button class="btn ghost" id="back">← All lessons</button><span class="eyebrow">${title(S.sec)}</span></div>
  <div class="bar"><strong>Question ${S.i+1} of ${n}</strong><button class="btn ghost small" id="peek">Key concepts for ${q.sec}</button></div>
  <div class="prog">${S.qs.map((_,j)=>`<span class="${S.res[j]||(j===S.i?'cur':'')}"></span>`).join('')}</div>
  <div class="card">
    ${isTest(S.sec)?`<span class="tag">${secName(q.sec)}</span>`:''}
    <p class="prompt">${q.prompt}</p>
    ${q.eq?EQ(q.eq):''}${q.eqHTML||''}${q.graph||''}
    ${q.type==='mc'?`<div class="choices">${q.choices.map((c,j)=>`<button class="choice" data-i="${j}"><span class="k">${'ABCD'[j]}</span><span>${c}</span></button>`).join('')}</div>`
      :`<div class="fields">${q.fields.map(fieldHTML).join('')}</div>`}
    <p class="msg" id="msg" aria-live="polite"></p>
    <div class="actions"><button class="btn primary" id="check">Check</button><button class="btn" id="hintb">Hint</button><button class="btn ghost" id="reveal">Show solution</button></div>
    <div id="extra"></div>
  </div>
  <div id="peekbox"></div>
  <p class="tip" id="savenote" style="margin-top:12px">${saveNoteText()}</p>`;
  document.getElementById('back').onclick=home;
  document.getElementById('check').onclick=check;
  document.getElementById('peek').onclick=()=>{const b=document.getElementById('peekbox');if(b.innerHTML){b.innerHTML='';return}const c=CONCEPTS[q.sec];if(!S.done){S.peeked=true}logRead(unitOf(q.sec),'peek',q.sec);
    b.innerHTML=`<section class="concept mini"><header><span class="num">${q.sec}</span><h2>${secObj(q.sec).title}</h2></header><dl class="rules">${c.rules.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl><div class="watch"><span class="eyebrow">Watch out</span><ul>${c.watch.map(x=>`<li>${x}</li>`).join('')}</ul></div></section>`;b.scrollIntoView({behavior:'smooth',block:'nearest'})};
  document.getElementById('hintb').onclick=()=>{const x=document.getElementById('extra');if(!x.querySelector('.hint'))x.insertAdjacentHTML('afterbegin',`<p class="hint"><b>Hint:</b> ${q.hint}</p>`);document.getElementById('hintb').disabled=true;S.hinted=true};
  document.getElementById('reveal').onclick=reveal;
  app.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(S.done)return;S.pick=+b.dataset.i;app.querySelectorAll('.choice').forEach(c=>{c.classList.toggle('sel',c===b);c.classList.remove('no')})});
  app.querySelectorAll('.field input').forEach((inp,j)=>inp.addEventListener('input',()=>{inp.classList.remove('no','ok');const pv=document.getElementById('pv'+j);if(pv)pv.innerHTML=inp.value.trim()?'Reads as: '+M(esc(pretty(inp.value))):''}));
  app.querySelectorAll('.key').forEach(k=>{k.onmousedown=e=>e.preventDefault();k.onclick=()=>{const inp=document.getElementById(k.dataset.for);if(inp.readOnly)return;const a=inp.selectionStart??inp.value.length,b=inp.selectionEnd??a;inp.value=inp.value.slice(0,a)+k.dataset.ins+inp.value.slice(b);const p=a+k.dataset.ins.length;inp.focus();try{inp.setSelectionRange(p,p)}catch(e){}inp.dispatchEvent(new Event('input'))}});
  const first=app.querySelector('.field input');if(first)first.focus({preventScroll:true});
}
function msg(t,c){const m=document.getElementById('msg');m.textContent=t;m.className='msg '+c}
function check(){
  const q=S.qs[S.i];if(S.done)return next();
  if(q.type==='mc'){
    if(S.pick==null)return msg('Pick an answer first.','info');
    const btn=app.querySelector(`.choice[data-i="${S.pick}"]`);
    if(S.pick===q.correct){btn.classList.remove('sel');btn.classList.add('ok');finish(S.tries===0?'first':'retry')}
    else{S.tries++;S.wrong.push(plain(q.choices[S.pick]));btn.classList.remove('sel');btn.classList.add('no');S.pick=null;msg('Not quite. Try another choice, or use the hint.','bad')}
    return;
  }
  const ins=[...app.querySelectorAll('.field input')];
  if(ins.some(i=>!i.value.trim()))return msg('Fill in every box first.','info');
  const results=[];
  for(let j=0;j<ins.length;j++){const f=q.fields[j],v=ins[j].value;
    if(f.kind==='expr'){const r=checkExpr(v,f);if(r.bad)return msg('That expression could not be read. Check the parentheses, and type powers like x^2.','info');results.push(r)}
    else{const n=parseNum(v);if(Number.isNaN(n))return msg(`“${f.label}” needs a number. Fractions like 3/4 work too.`,'info');results.push({ok:matches(n,f.ans)})}}
  results.forEach((r,j)=>{ins[j].classList.toggle('ok',r.ok);ins[j].classList.toggle('no',!r.ok)});
  if(results.every(r=>r.ok))return finish(S.tries===0?'first':'retry');
  S.tries++;S.wrong.push(ins.map((i,j)=>`${q.fields[j].label} = ${i.value.trim()}`).join(', '));
  const why=results.find(r=>r.why);msg(why?why.why:'Not quite. Fix the red boxes and check again.','bad');
}
function finish(r){
  const q=S.qs[S.i];S.done=true;S.res[S.i]=r;
  const ans=q.type==='mc'?plain(q.choices[q.correct]):q.fields.map(f=>`${f.label} = ${f.disp}`).join(', ');
  const qt=[plain(q.prompt),plain(q.eq),plain((q.eqHTML||'').replace(/<span class="pw-b">/g,' ').replace(/<span class="pw-c">/g,' ').replace(/<\/span><\/span><span class="m">/g,'; '))].filter(Boolean).join(' ')+(q.graph?' [graph]':'');
  S.items[S.i]={sec:q.sec,r,q:qt.slice(0,300),ans:ans.slice(0,200),wrong:S.wrong.slice(0,6).map(w=>w.slice(0,160)),hint:!!S.hinted,peek:!!S.peeked};
  save();
  msg(r==='first'?'Correct!':r==='retry'?'Correct on a retry.':'Here is the solution. Read through it, then move on.',r==='shown'?'info':'good');
  if(q.type!=='mc')app.querySelectorAll('.field input').forEach(i=>i.readOnly=true);
  const answers=q.type==='mc'?'':`<p class="ans">Answer: ${q.fields.map(f=>`${f.label} = ${M(f.disp)}`).join(' · ')}</p>`;
  document.getElementById('extra').insertAdjacentHTML('beforeend',`<div class="steps"><h3>How to solve it</h3><ol>${q.steps.map(s=>`<li>${s}</li>`).join('')}</ol>${answers}</div>`);
  const c=document.getElementById('check');c.textContent=S.i===S.qs.length-1?'See results':'Next question';c.focus({preventScroll:true});
  document.getElementById('reveal').hidden=true;document.getElementById('hintb').hidden=true;
  app.querySelectorAll('.prog span').forEach((s,j)=>{s.className=S.res[j]||(j===S.i?'cur':'')});
}
function reveal(){
  const q=S.qs[S.i];if(S.done)return;
  if(q.type==='mc'){app.querySelectorAll('.choice').forEach(b=>{b.classList.remove('sel');if(+b.dataset.i===q.correct)b.classList.add('ok')})}
  else app.querySelectorAll('.field input').forEach((inp,j)=>{if(inp.value.trim()&&!S.wrong.length)S.wrong.push('(partly typed, then used solution)');inp.value=q.fields[j].disp;inp.classList.remove('no');inp.classList.add('ok')});
  finish('shown');
}
function next(){S.i++;if(S.i>=S.qs.length)summary();else{show();window.scrollTo(0,0)}}
function summary(){
  VIEW='summary';
  const pts=S.res.reduce((a,r)=>a+ptsOf(r),0),n=S.qs.length,pct=Math.round(100*pts/n);
  local.set(S.sec,pct);
  const note=pct>=90?'Excellent. You are ready for this.':pct>=75?'Solid. Look over the yellow and red ones, then try a new set.':pct>=50?'Getting there. Reread the key concepts for the ones you missed and try a new set.':'Keep going. Read the key concepts for this lesson, use the hints, and try a new set.';
  let bySec='';
  if(isTest(S.sec)){bySec=`<h3>By lesson</h3><div class="list">${unitSecs(unitOf(S.sec)).filter(s=>S.qs.some(q=>q.sec===s.id)).map(s=>{let p=0,c=0;S.qs.forEach((q,j)=>{if(q.sec===s.id){c++;p+=ptsOf(S.res[j])}});const pc=Math.round(100*p/c);return `<button class="row" data-go="${s.id}"><span class="num">${s.id}</span><span><span class="t">${s.title}</span><span class="d">${p} of ${c} points</span></span><span class="chip ${cls(pc)}">${pc}%</span></button>`}).join('')}</div><p class="tip">Tap a lesson to practice just that one.</p>`}
  app.innerHTML=`
  <div class="bar"><button class="btn ghost" id="back">← All lessons</button><span class="eyebrow">${title(S.sec)}</span></div>
  <div class="card">
    <div class="score"><span class="big">${pct}%</span><span>${pts} of ${n} points</span></div>
    <p style="margin:0">${note}</p>
    <div class="legend"><span><i class="dot first"></i>First try</span><span><i class="dot retry"></i>After a retry</span><span><i class="dot shown"></i>Used solution</span></div>
    ${!isTest(S.sec)?`<ol class="recap">${S.qs.map((q,j)=>`<li><i class="dot ${S.res[j]}"></i><span>Q${j+1}</span><span>${esc((t=>t.length>70?t.slice(0,70)+'…':t)(plain(q.prompt)))}</span></li>`).join('')}</ol>`:bySec}
    <div class="actions"><button class="btn primary" id="again">${REVIEW_NAMES[S.sec]?'New version of this review':isTest(S.sec)?'New practice test':'New set, same lesson'}</button>${!isTest(S.sec)?`<button class="btn" id="rc">Key concepts for ${S.sec}</button>`:''}<button class="btn" id="home2">All lessons</button><button class="btn ghost" id="prog2">Progress log</button></div>
    <p class="tip" id="savenote">${saveNoteText()}</p>
  </div>`;
  const sec=S.sec;
  document.getElementById('back').onclick=home;document.getElementById('home2').onclick=home;document.getElementById('prog2').onclick=progress;
  const rc=document.getElementById('rc');if(rc)rc.onclick=()=>concepts(unitOf(sec),sec);
  document.getElementById('again').onclick=()=>start(sec);
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>start(b.dataset.go));
  window.scrollTo(0,0);
}

/* ---- progress log ---- */
function spark(vals){
  if(vals.length<2)return '';
  const W=96,H=26,P=3,x=i=>P+i*(W-2*P)/(vals.length-1),y=v=>H-P-(v/100)*(H-2*P);
  const d=vals.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join('');
  const l=vals.length-1;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-label="Scores over time: ${vals.join('%, ')}%"><line class="g-grid" x1="${P}" x2="${W-P}" y1="${y(85)}" y2="${y(85)}"/><path class="g-curve" style="stroke-width:1.8" d="${d}"/><circle class="g-dot" cx="${x(l)}" cy="${y(vals[l])}" r="2.8"/></svg>`;
}
let progLoading=false;
function progress(){
  leaveConcepts();
  if(VIEW!=='progress'&&!progLoading&&dbState==='on'){progLoading=true;setTimeout(()=>refresh().finally(()=>{progLoading=false}),0)}
  VIEW='progress';S=null;
  const ALL=allAtt();const people=[...new Set(ALL.map(a=>a.uid))];
  if(FILTER!=='all'&&!people.includes(FILTER))FILTER='all';
  const rows=ALL.filter(a=>FILTER==='all'||a.uid===FILTER);
  const reads=READS.filter(a=>FILTER==='all'||a.uid===FILTER);
  const fin=rows.filter(a=>a.finished);
  const avg=fin.length?Math.round(fin.reduce((t,a)=>t+a.pct,0)/fin.length):null;
  const qCount=rows.reduce((t,a)=>t+(a.answered||0),0);
  const unitTable=u=>{const U=UNITS[u],secs=[...unitSecs(u).map(s=>s.id),U.test,...(U.reviews||[])],rd=reads.filter(r=>r.unit===u);
    return `<h2 class="sub">${U.name}: ${U.title}</h2>
    <p class="tip" style="margin:-4px 0 10px">${(()=>{const pg=rd.filter(r=>r.kind==='page'),ts=rd.filter(r=>r.kind==='time').reduce((a,r)=>a+(r.secs||0),0),tm=ts<60?(ts?'under a minute':'no time logged'):`about ${Math.round(ts/60)} min`,pk=rd.filter(r=>r.kind==='peek').length;
      return pg.length?`Key concepts page opened ${pg.length} time${pg.length>1?'s':''}, last ${fmtDate(pg[0].at)} · ${tm} reading · ${pk} quick look${pk===1?'':'s'} during questions.`:'Key concepts not opened yet.'+(pk?` ${pk} quick look${pk===1?'':'s'} during questions.`:'')})()}</p>
    <div class="table"><table><thead><tr><th>Lesson</th><th>Sets</th><th>Last</th><th>Best</th><th>Trend</th><th>Key concepts</th><th></th></tr></thead><tbody>
    ${secs.map(sec=>{const f=fin.filter(a=>a.sec===sec).sort((a,b)=>a.startedAt-b.startedAt);const last=f[f.length-1],b=f.length?Math.max(...f.map(a=>a.pct)):null;
      return `<tr><td><strong>${REVIEW_NAMES[sec]?REVIEW_TAG[sec]:isTest(sec)?'Test':sec}</strong> <span class="d">${REVIEW_NAMES[sec]?REVIEW_NAMES[sec].replace(/^Unit \d+ /,''):isTest(sec)?'Mixed practice test':secObj(sec).title}</span></td><td class="n">${f.length||'–'}</td><td>${last?`<span class="chip ${cls(last.pct)}">${last.pct}%</span>`:'<span class="d">–</span>'}</td><td>${b!=null?`<span class="chip ${cls(b)}">${b}%</span>`:'<span class="d">–</span>'}</td><td>${spark(f.slice(-10).map(a=>a.pct))}</td><td class="d">${isTest(sec)?'':(()=>{const bl=rd.filter(r=>r.kind==='block'&&r.sec===sec),pk=rd.filter(r=>r.kind==='peek'&&r.sec===sec);return bl.length||pk.length?[bl.length?`read ${bl.length}×`:'',pk.length?`${pk.length} look${pk.length>1?'s':''}`:''].filter(Boolean).join(' · '):'not read'})()}</td><td><button class="btn small" data-go="${sec}">Practice</button></td></tr>`}).join('')}
    </tbody></table></div>`};
  let body='';
  if(dbState!=='on'&&!rows.length)body=`<div class="card"><p style="margin:0">${saveNoteText()}</p></div>`;
  else{
    body=`
    <div class="stats"><div><span class="big2">${rows.length}</span><span class="d">sets started</span></div><div><span class="big2">${fin.length}</span><span class="d">sets finished</span></div><div><span class="big2">${qCount}</span><span class="d">questions answered</span></div><div><span class="big2">${avg==null?'–':avg+'%'}</span><span class="d">average score</span></div></div>
    ${unitTable('4')}${unitTable('3')}${unitTable('2')}
    <h2 class="sub">Every set</h2>
    ${rows.length?`<div class="hist">${rows.map(a=>{
      const items=(a.items||[]).filter(Boolean);const miss=items.filter(x=>x.r!=='first');
      return `<details class="att" data-id="${a.id}"${OPEN.has(a.id)?' open':''}><summary><span class="when">${fmtDate(a.startedAt)}</span><span class="what"><strong>${secName(a.sec)}</strong>${people.length>1?` · ${esc(who(a.uid))}`:''}</span><span class="res">${a.pendingLocal?'<span class="chip half">On this device, not sent yet</span> ':''}${a.finished?`<span class="chip ${cls(a.pct)}">${a.pct}%</span> <span class="d">${a.points} / ${a.total}</span>`:`<span class="chip">Stopped at ${a.answered} of ${a.total}</span>`}</span></summary>
      <div class="attbody">
        <div class="dots">${Array.from({length:a.total},(_,j)=>{const it=(a.items||[])[j];return `<i class="dot ${it?it.r:'none'}" title="Q${j+1}"></i>`}).join('')}</div>
        ${miss.length?`<ol class="missed">${miss.map(x=>`<li><span class="d">${x.sec} · ${x.r==='retry'?'right after a retry':'used the solution'}${x.hint?' · used hint':''}${x.peek?' · looked at key concepts':''}</span><span>${esc(x.q)}</span><span><b>Correct:</b> ${esc(x.ans)}</span>${x.wrong&&x.wrong.length?`<span><b>Tried:</b> ${x.wrong.map(esc).join(' → ')}</span>`:''}</li>`).join('')}</ol>`:`<p style="margin:0">${items.length?'Every answered question was right on the first try.':'No questions answered.'}</p>`}
        ${OWNER&&!a.pendingLocal?`<button class="btn ghost small rm" data-rm="${a.id}">Remove this set</button>`:''}
      </div></details>`}).join('')}</div>`:`<div class="card"><p style="margin:0">No sets yet. Each set is saved here as it is played, even if it is not finished.</p></div>`}`;
  }
  app.innerHTML=`
  <div class="bar"><button class="btn ghost" id="back">← All lessons</button><span class="eyebrow">Progress log</span></div>
  <div class="head"><h1>Progress</h1><p class="lede">Every set is saved as it is played. Open a set to see the questions that were missed, the right answer, and what was tried.</p>
  <div class="actions"><button class="btn small" id="prefresh">Refresh</button>${OWNER?'<button class="btn small" id="pcsv">Download results (CSV)</button><button class="btn small" id="pjson">Download full backup</button>':''}</div></div>
  ${people.length>1?`<div class="filters"><button class="fbtn ${FILTER==='all'?'on':''}" data-f="all">Everyone</button>${people.map(p=>`<button class="fbtn ${FILTER===p?'on':''}" data-f="${esc(p)}">${esc(who(p))}</button>`).join('')}</div>`:''}
  ${body}`;
  app.querySelectorAll('details.att').forEach(d=>d.addEventListener('toggle',()=>{d.open?OPEN.add(d.dataset.id):OPEN.delete(d.dataset.id)}));
  document.getElementById('back').onclick=home;
  document.getElementById('prefresh').onclick=()=>refresh();
  const pc=document.getElementById('pcsv');if(pc)pc.onclick=exportCSV;const pj=document.getElementById('pjson');if(pj)pj.onclick=exportJSON;
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>start(b.dataset.go));
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{FILTER=b.dataset.f;progress()});
  app.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{
    if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='Click again to remove for good';b.classList.add('danger');return}
    b.disabled=true;const {error}=await SB.from('algebra_attempts').delete().eq('id',b.dataset.rm);if(error){b.textContent='Could not remove it. Try again.';b.disabled=false;b.dataset.armed=''}else refresh();
  });
}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&VIEW==='quiz'&&document.getElementById('check')&&!e.target.closest('button')){e.preventDefault();check()}});
home();
initDB();
document.addEventListener('visibilitychange',()=>{if(CONC){if(document.visibilityState==='hidden'){if(CONC.since){CONC.ms+=Date.now()-CONC.since;CONC.since=0}}else CONC.since=Date.now()}if(document.visibilityState==='visible'){if(dbState==='error')afterAuth();else{flush();flushReads();if(VIEW==='progress')refresh()}}});
window.addEventListener('pagehide',()=>leaveConcepts());
window.addEventListener('online',()=>{if(dbState==='error')afterAuth();else{flush();flushReads()}});
setInterval(()=>{if(dbState==='error')afterAuth();else{if(pendingCount())flush();if(rdq().length)flushReads()}},30000);
</script>
